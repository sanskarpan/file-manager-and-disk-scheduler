name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++
      - name: Build (direct)
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic main.cpp -o file_manager
          c++ -std=c++17 -Wall -Wextra -Wpedantic try.cpp -o disk_scheduling
          c++ -std=c++17 -Wall -Wextra -Wpedantic -DDISK_SCHEDULING_TEST=1 try.cpp -o disk_scheduling_test
          ./disk_scheduling_test --test
      - name: Build (CMake + CTest)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build -V

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: pytest tests/ -v --cov=app --cov-report=term-missing
      - name: Lint
        run: |
          pip install black ruff
          black --check app.py tests/
          ruff check app.py tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t os-project:test .
